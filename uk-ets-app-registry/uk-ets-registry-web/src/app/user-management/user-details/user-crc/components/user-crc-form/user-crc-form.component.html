<div appScreenReaderPageAnnounce pageTitle="Is this user an agent?"></div>

<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
    <h1 class="govuk-heading-xl">Has a valid CRC been provided?</h1>
    <form
      (ngSubmit)="onContinue()"
      [formGroup]="formGroup"
      [appConnectForm]="_crcDetails"
    >
      <div class="govuk-fieldset" role="group">
        <fieldset class="govuk-fieldset" role="group">
          <fieldset class="govuk-fieldset govuk-!-margin-bottom-4">
            <app-uk-radio-input
              controlName="crc"
              [formRadioGroupInfo]="crcRadioGroup()"
              [validationErrorMessage]="validationErrorMessage.crc"
            />
          </fieldset>
          <ng-template #crcDetailsTemplate>
            <div
              formGroupName="crcDetails"
              class="govuk-form-group"
              [class.govuk-form-group--error]="showCrcDetailsError()"
              id="crcDetails-label"
            >
              <!-- Agent phone -->
              @if (showCrcDetailsError()) {
                <p
                  class="govuk-error-message"
                  [attr.id]="'crcDetails-error-label'"
                >
                  <span class="govuk-visually-hidden">Error:</span>
                  {{ validationErrorMessage.crcDetails }}
                </p>
              }
              <app-uk-date-control
                [minAge]="0"
                [maxAge]="100"
                [label]="'Issuance Date'"
                [showErrors]="showErrors"
                formControlName="crcIssuanceDate"
                [validationErrorMessages]="validationMessages.crcIssuanceDate"
              ></app-uk-date-control>
            </div>
          </ng-template>
        </fieldset>
      </div>
      <button
        class="govuk-button"
        data-module="govuk-button"
        type="submit"
        id="continue"
      >
        Continue
      </button>
    </form>
  </div>
</div>
